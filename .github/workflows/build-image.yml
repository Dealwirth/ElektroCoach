name: Add-on-Abbild bauen

# Baut das fertige Home-Assistant-Abbild fuer ARM64 (Raspberry Pi) und AMD64
# und legt es in der GitHub-Registry ab. Home Assistant laedt beim
# Installieren nur noch das fertige Abbild herunter, statt auf dem Raspberry
# Pi zu bauen. Das macht die Installation deutlich schneller und robuster.

on:
  push:
    branches: ["main"]
    paths:
      - "elektrocoach/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: dealwirth
  VERSION: "1.0.0"

jobs:
  build:
    name: Abbild ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Anmelden an der Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: ./elektrocoach
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/elektrocoach-${{ matrix.arch }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/elektrocoach-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

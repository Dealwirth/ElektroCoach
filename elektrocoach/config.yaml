name: "ElektroCoach"
version: "1.0.15"
slug: "elektrocoach"
description: "KI-Lernplattform für Elektroniker Energie- und Gebäudetechnik mit OCR-Import, Lernsystem, Prüfungssimulation und Schaltplan-Editor"
url: "https://github.com/Dealwirth/ElektroCoach/tree/main/elektrocoach"
arch:
  - aarch64
  - amd64
init: false
stage: stable
startup: application
boot: auto
homeassistant: "2024.1.0"
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:school
panel_title: "ElektroCoach"
panel_admin: false
homeassistant_api: true
# Supervisor-Zugriff, damit ElektroCoach das Ollama-Add-on finden, starten und
# Modelle laden kann. Ohne hassio_api liefert /addons nur einen Fehler.
hassio_api: true
hassio_role: manager
timeout: 30
tmpfs: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Weboberfläche (nur nötig, wenn Ingress nicht verwendet wird)"
map:
  - share:rw
  - media:ro
options:
  gemini_api_key: ""
  gemini_text_model: "gemini-flash-latest"
  gemini_vision_model: "gemini-flash-latest"
  ollama_url: "http://localhost:11434"
  ollama_model: "llama3.2:1b"
  ollama_vision_model: "qwen2.5vl:3b"
  ocr_refine_formulas: true
  ollama_refine_model: ""
  ocr_vision_use_draft: false
  ocr_vision_passes: 3
  ocr_timeout_seconds: 900
  ocr_vision_models: ""
  ocr_vision_group_size: 3
  ocr_vision_full_page: true
  ocr_vision_fraction_pass: true
  ocr_vision_windows: true
  ocr_vision_isolated: true
  ocr_vision_reference_weight: 2
  ollama_enabled: false
  ocr_languages: "deu+eng"
  ocr_engine: "auto"
  ocr_use_vision_model: true
  ocr_postprocess: "formula"
  ai_mode: "auto"
  ai_timeout_seconds: 180
  refine_after_import: false
  refine_use_cloud: false
  ha_notify_service: ""
  mqtt_enabled: false
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  daily_study_minutes: 45
  sensor_update_interval: 300
  log_level: "info"
schema:
  gemini_api_key: "password?"
  gemini_text_model: "str"
  gemini_vision_model: "str"
  ollama_url: "str"
  ollama_model: "str"
  ollama_vision_model: "str"
  ocr_refine_formulas: "bool"
  ollama_refine_model: "str"
  ocr_vision_use_draft: "bool"
  ocr_vision_passes: "int(1,3)"
  ocr_timeout_seconds: "int(60,3600)"
  ocr_vision_models: "str"
  ocr_vision_group_size: "int(1,6)"
  ocr_vision_full_page: "bool"
  ocr_vision_fraction_pass: "bool"
  ocr_vision_windows: "bool"
  ocr_vision_isolated: "bool"
  ocr_vision_reference_weight: "int(1,5)"
  ollama_enabled: "bool"
  ocr_languages: "str"
  ocr_engine: "list(auto|trocr|tesseract)"
  ocr_use_vision_model: "bool"
  ocr_postprocess: "list(off|light|standard|formula)"
  ai_mode: "list(auto|local_only|cloud_only|off)"
  ai_timeout_seconds: "int(30,900)"
  refine_after_import: "bool"
  refine_use_cloud: "bool"
  ha_notify_service: "str?"
  mqtt_enabled: "bool"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_discovery_prefix: "str?"
  daily_study_minutes: "int(5,600)"
  sensor_update_interval: "int(30,3600)"
  log_level: "list(debug|info|warning|error)"

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>ElektroCoach</title>
    <!--
      Home Assistant stellt das Add-on unter einem wechselnden Pfad aus
      (/api/hassio_ingress/<token>/). Dieser Pfad ist zur Build-Zeit unbekannt,
      deshalb wird er hier zur Laufzeit ermittelt und als <base> gesetzt.
      Damit loesen auch verschachtelte Seiten (z. B. /pruefungen/abc) ihre
      Dateipfade (assets/...) korrekt auf, nicht nur die Startseite.
    -->
    <script>
      (function () {
        var match = window.location.pathname.match(/^(.*?\/hassio_ingress\/[^/]+)/);
        var prefix = match ? match[1] : "";
        var base = document.createElement("base");
        base.href = prefix + "/";
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

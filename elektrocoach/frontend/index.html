<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>ElektroCoach</title>
    <!--
      Home Assistant stellt das Add-on unter einem wechselnden Pfad aus
      (/api/hassio_ingress/<token>/). Dieser Pfad ist zur Build-Zeit unbekannt.
      Das Backend fuegt deshalb beim Ausliefern ein Basiselement in den Kopf
      ein (siehe app/main.py, _base_href). Dieses Skript ist nur ein Ersatz,
      falls die Seite ohne das Backend ausgeliefert wird (Entwicklung, Tests).
    -->
    <script>
      (function () {
        if (document.querySelector("base")) return;
        var match = window.location.pathname.match(/^(.*?\/hassio_ingress\/[^/]+)/);
        var base = document.createElement("base");
        base.href = (match ? match[1] : "") + "/";
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

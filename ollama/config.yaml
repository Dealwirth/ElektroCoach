name: ElektroCoach Ollama
version: "0.1.0"
slug: elektrocoach_ollama
description: >-
  Lokaler Ollama-Server fuer ElektroCoach. Stellt kleine Sprachmodelle
  (z. B. qwen2.5:1.5b) auf dem Raspberry Pi 4 bereit. Keine Cloud, keine Kosten.
url: https://github.com/Dealwirth/ElektroCoach
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ports:
  "11434/tcp": null
ports_description:
  "11434/tcp": Ollama HTTP API (intern, kein Port-Mapping noetig)
map:
  - type: share
    read_only: false
options:
  models:
    - "qwen2.5:1.5b"
  keep_alive: "5m"
  num_parallel: 1
  max_loaded_models: 1
  context_length: 2048
schema:
  models:
    - str
  keep_alive: str
  num_parallel: int(1,4)
  max_loaded_models: int(1,4)
  context_length: int(512,8192)
